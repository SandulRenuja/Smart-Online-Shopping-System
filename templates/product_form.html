<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Product Entry Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            padding: 0;
        }

        label {
            display: inline-block;
            width: 150px;
        }

        input[type="text"], input[type="number"], textarea, select {
            width: 200px;
            padding: 5px;
            margin-bottom: 10px;
        }

        input[type="file"] {
            margin-bottom: 20px;
        }

        img {
            margin-top: 10px;
            max-width: 200px;
        }

        input[type="submit"] {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }

        input[type="submit"]:hover {
            background-color: #45a049;
        }

        .form-container {
            width: 400px;
            margin: auto;
            border: 1px solid #ccc;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 2px 2px 12px #aaa;
        }
    </style>
    <script>
        function validateForm() {
            let price = document.getElementById('price').value;
            let stock = document.getElementById('stock').value;

            if (price <= 0) {
                alert("Price must be a positive number.");
                return false;
            }

            if (stock < 0) {
                alert("Stock quantity cannot be negative.");
                return false;
            }

            return true;
        }

        function previewImage(event) {
            let reader = new FileReader();
            reader.onload = function(){
                let output = document.getElementById('image_preview');
                output.src = reader.result;
                output.style.display = 'block';
            };
            reader.readAsDataURL(event.target.files[0]);
        }
    </script>
</head>
<body>
    <h1>Enter Product Details</h1>
    <div class="form-container">
        <form action="/product/new" method="POST" enctype="multipart/form-data" onsubmit="return validateForm()">
            <label for="category">Category:</label>
            <select name="category" id="category" required>
                <option value="Headphones">Headphones</option>
                <option value="Laptops">Laptops</option>
                <option value="Phones">Phones</option>
                <option value="Smart Watches">Smart Watches</option>
                <option value="Tablets">Tablets</option>
            </select><br><br>

            <label for="product_name">Product Name:</label>
            <input type="text" id="product_name" name="product_name" required><br><br>

            <label for="price">Price:</label>
            <input type="number" step="0.01" id="price" name="price" required><br><br>

            <label for="description">Description:</label>
            <textarea id="description" name="description" rows="4" required></textarea><br><br>

            <label for="stock">Stock Quantity:</label>
            <input type="number" id="stock" name="stock" required><br><br>

            <label for="image">Product Image:</label>
            <input type="file" id="image" name="image" accept="image/*" onchange="previewImage(event)"><br><br>
            <img id="image_preview" src="" alt="Image Preview" style="display: none;"><br><br>

            <input type="submit" value="Submit">
        </form>
    </div>
</body>
</html>
