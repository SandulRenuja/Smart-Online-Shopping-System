<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Products</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            padding: 0;
        }

        .category-row {
            margin-bottom: 40px;
        }

        .category-title {
            font-size: 24px;
            margin-bottom: 20px;
            border-bottom: 2px solid #ccc;
            padding-bottom: 10px;
        }

        .product-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        .product-card {
            width: 300px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            padding: 20px;
            text-align: center;
            background-color: #f9f9f9;
        }

        .product-card img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .product-card h2 {
            font-size: 20px;
            margin: 10px 0;
        }

        .product-card p {
            font-size: 16px;
            color: #666;
        }

        .product-card .price {
            font-size: 18px;
            color: #333;
            font-weight: bold;
        }

        .product-card .stock {
            font-size: 14px;
            color: #777;
            margin-bottom: 10px;
        }

        /* Chat popup styles */
        .chat-container {
            display: none;
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 300px;
            border: 1px solid #ddd;
            padding: 20px;
            background-color: #6d64a2;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            z-index: 100;
        }

        .chat-messages {
            max-height: 200px;
            overflow-y: auto;
            margin-bottom: 10px;
        }

        .message {
            padding: 5px 10px;
            border-radius: 4px;
            margin-bottom: 5px;
        }

        .message.bot {
            background-color: #c8c8c8;
            text-align: left;
        }

        .message.user {
            background-color: #c8e6c9;
            text-align: right;
        }

        .input-container {
            display: flex;
            gap: 5px;
        }

        .input-container input {
            flex: 1;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .input-container button {
            padding: 8px 12px;
            background-color: #007bff;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        /* Chat icon styles */
        .chat-icon {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 80px;
            height: 80px;
            background-color: #007bff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            z-index: 99;
        }

        .chat-icon img {
            width: 30px;
            height: 30px;
        }
    </style>
</head>
<body>
    {% for category, products in products_by_category.items() %}
    <div class="category-row">
        <h2 class="category-title">{{ category }}</h2>
        <div class="product-container">
            {% for product in products %}
            <div class="product-card">
                <img src="{{ product.image_url or '/static/default.png' }}" alt="{{ product.product_name }}">
                <h2>{{ product.product_name }}</h2>
                <p class="price">${{ product.price }}</p>
                <p class="stock">{{ product.stock }} in stock</p>
                <p>{{ product.description }}</p>
            </div>
            {% endfor %}
        </div>
    </div>
    {% endfor %}

    <!-- Chat container (hidden by default) -->
    <div class="chat-container" id="chatContainer">
        <div class="chat-messages" id="chatMessages"></div>
        <div class="input-container">
            <input type="text" id="userInput" placeholder="Type a message...">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <!-- Chat icon -->
    <div class="chat-icon" id="chatIcon">
        <img src="/static/icon.png" alt="Chat Icon">
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        // Toggle chat popup visibility
        document.getElementById('chatIcon').addEventListener('click', function() {
            const chatContainer = document.getElementById('chatContainer');
            chatContainer.style.display = chatContainer.style.display === 'none' || chatContainer.style.display === '' ? 'block' : 'none';
        });

        function displayMessage(sender, message) {
            const chatMessages = document.getElementById('chatMessages');
            const messageElement = document.createElement('div');
            messageElement.className = `message ${sender.toLowerCase()}`;
            messageElement.textContent = message;
            chatMessages.appendChild(messageElement);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function displayOptions(options) {
            const chatMessages = document.getElementById('chatMessages');
            options.forEach(option => {
                const button = document.createElement('button');
                button.textContent = option;
                button.onclick = function() {
                    sendMessage(option);
                };
                chatMessages.appendChild(button);
            });
        }

        function sendMessage(text) {
            const message = text || $('#userInput').val();
            displayMessage('You', message);
            $('#userInput').val('');

            $.ajax({
                url: '/chat',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({message: message}),
                success: function(response) {
                    displayMessage('Bot', response.response);
                    if (response.options && response.options.length) {
                        displayOptions(response.options);
                    }
                },
                error: function() {
                    displayMessage('Bot', 'Sorry, something went wrong.');
                }
            });
        }
    </script>
</body>
</html>
